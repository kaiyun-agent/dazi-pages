'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, parse=s=>new Date(s+'T12:00:00'), now=parse(new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date())), today=dateKey(now), add=n=>{const d=new Date(now);d.setDate(d.getDate()+n);return dateKey(d)}, short=s=>s.slice(5).replace('-','/');
function workdays(a,b){const out=[];for(let d=parse(a);dateKey(d)<=b;d.setDate(d.getDate()+1)){if(d.getDay()!==0&&d.getDay()!==6)out.push(dateKey(d))}return out}
const days=workdays(today,add(9)).slice(0,5), KEY='teamflow-workspace-v1';let view='overview',query='',filter='all',editKind='',editId='',persistent=true;
const seed={version:1,people:[{id:'u1',name:'林晨',role:'前端研发',capacity:8},{id:'u2',name:'陈宇',role:'后端研发',capacity:8},{id:'u3',name:'苏晴',role:'前端研发',capacity:8},{id:'u4',name:'张帆',role:'后端研发',capacity:8},{id:'u5',name:'许安',role:'测试工程师',capacity:8}],projects:[{id:'p1',name:'客户管理平台',code:'CRM',owner:'林晨',due:add(12),color:'#778df2'},{id:'p2',name:'数据分析中台',code:'DATA',owner:'陈宇',due:add(5),color:'#b28ade'},{id:'p3',name:'移动端体验升级',code:'APP',owner:'苏晴',due:add(19),color:'#69b9a5'},{id:'p4',name:'开放 API 服务',code:'API',owner:'张帆',due:add(-1),color:'#e5ac64'}],tasks:[{id:'t1',name:'客户详情页与交互联调',project:'p1',person:'u1',start:today,end:days[4],hours:30,status:'doing'},{id:'t2',name:'权限模块开发',project:'p1',person:'u4',start:today,end:days[4],hours:28,status:'doing'},{id:'t3',name:'指标计算引擎优化',project:'p2',person:'u2',start:today,end:days[4],hours:44,status:'doing'},{id:'t4',name:'核心流程回归测试',project:'p2',person:'u5',start:days[1],end:days[4],hours:24,status:'todo'},{id:'t5',name:'首页视觉与性能优化',project:'p3',person:'u3',start:today,end:days[1],hours:10,status:'doing'},{id:'t6',name:'接口鉴权与限流',project:'p4',person:'u2',start:add(-4),end:add(-1),hours:16,status:'doing'},{id:'t7',name:'需求评审与原型确认',project:'p1',person:'u1',start:add(-10),end:add(-7),hours:16,status:'done'},{id:'t8',name:'数据源接入',project:'p2',person:'u2',start:add(-10),end:add(-6),hours:20,status:'done'},{id:'t9',name:'接口协议设计',project:'p4',person:'u4',start:add(-10),end:add(-8),hours:8,status:'done'},{id:'t10',name:'交互方案评审',project:'p3',person:'u3',start:add(-6),end:add(-3),hours:12,status:'done'}]};
function valid(d){const str=x=>typeof x==='string'&&x.length>0&&x.length<=160, date=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(parse(s))&&dateKey(parse(s))===s&&s>='2000-01-01'&&s<='2100-12-31',unique=a=>new Set(a.map(x=>x.id)).size===a.length;return d&&d.version===1&&['people','projects','tasks'].every(k=>Array.isArray(d[k])&&d[k].length<=1000&&d[k].every(x=>x&&str(x.id))&&unique(d[k]))&&d.people.every(p=>str(p.name)&&str(p.role)&&Number.isFinite(p.capacity)&&p.capacity>0&&p.capacity<=12)&&d.projects.every(p=>str(p.name)&&str(p.owner)&&str(p.code)&&date(p.due))&&d.tasks.every(t=>str(t.name)&&d.people.some(p=>p.id===t.person)&&d.projects.some(p=>p.id===t.project)&&date(t.start)&&date(t.end)&&t.start<=t.end&&(parse(t.end)-parse(t.start))/86400000<=366&&workdays(t.start,t.end).length&&Number.isFinite(t.hours)&&t.hours>0&&t.hours<=3000&&['todo','doing','done'].includes(t.status))}
let db=structuredClone(seed);try{const saved=localStorage.getItem(KEY);if(saved){const d=JSON.parse(saved);if(valid(d))db=d;else setTimeout(()=>toast('本地数据格式不兼容，已展示演示数据'),0)}}catch{persistent=false}
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));persistent=true}catch{persistent=false;toast('浏览器无法保存，请导出数据备份')}render()}
function activeTasks(pid){return db.tasks.filter(t=>t.person===pid&&t.status!=='done')}
function daily(t){return t.hours/workdays(t.start,t.end).length}
function dayHours(pid,d){return activeTasks(pid).filter(t=>t.start<=d&&t.end>=d).reduce((s,t)=>s+daily(t),0)}
function load(p){return days.reduce((s,d)=>s+dayHours(p.id,d),0)/(p.capacity*days.length)*100}
function projectState(p){const ts=db.tasks.filter(t=>t.project===p.id),open=ts.filter(t=>t.status!=='done');if(ts.length&&!open.length)return['ok','已完成'];if(open.length&&(p.due<today||open.some(t=>t.end<today)))return['late','已延期'];if(open.some(t=>t.end>p.due||workdays(today,p.due).length<=3||days.some(d=>t.start<=d&&t.end>=d&&dayHours(t.person,d)>db.people.find(u=>u.id===t.person).capacity)))return['risk','有风险'];return['ok',ts.length?'进行中':'待启动']}
function progress(p){const ts=db.tasks.filter(t=>t.project===p.id),total=ts.reduce((s,t)=>s+t.hours,0);return total?Math.round(ts.filter(t=>t.status==='done').reduce((s,t)=>s+t.hours,0)/total*100):0}
function metrics(){const live=db.projects.filter(p=>projectState(p)[1]!=='已完成').length,risk=db.projects.filter(p=>projectState(p)[0]!=='ok').length,capacity=db.people.reduce((s,p)=>s+p.capacity*5,0),hours=db.people.reduce((s,p)=>s+days.reduce((a,d)=>a+dayHours(p.id,d),0),0),free=db.people.filter(p=>load(p)<60).length;$('#metrics').innerHTML=[['在推进项目',live,'个',`${db.projects.length} 个项目 · 持续追踪交付`,'▧',''],['团队计划负荷',Math.round(capacity?hours/capacity*100:0),'%',`未来 5 个工作日 · 建议 60–80%`,'◷',''],['待关注项目',risk,'个','逾期、临近交付或资源冲突','⚑','red'],['可调配人员',free,'人','未来 5 个工作日负荷低于 60%','♧','green']].map(([label,n,unit,hint,icon,color])=>`<div class="metric"><div class="metric-top">${label}<span class="metric-icon">${icon}</span></div><div class="metric-num ${color}">${n}<small>${unit}</small></div><div class="hint">${hint}</div></div>`).join('')}
function resource(){return `<section class="card lower"><div class="cardhead"><div><h2>人员排期 <span style="color:#9aa5b7;font-size:11px;font-weight:400">/ 未来 5 个工作日</span></h2><p>点击排期分配任务；负荷由未完成任务的计划工时均摊计算。</p></div><div class="legend"><span><i></i>已安排</span><span><i style="background:#f1a39c"></i>超出日容量</span><span><i style="background:#e0e5ee"></i>可安排</span></div></div><div class="resource-wrap"><div class="resource"><div class="day">成员 / 职能</div>${days.map(d=>`<div class="day">${short(d)} &nbsp; ${['周日','周一','周二','周三','周四','周五','周六'][parse(d).getDay()]}${d===today?' · 今天':''}</div>`).join('')}<div class="day">周负荷</div>${db.people.map(p=>`<div class="person"><span class="avatar">${esc(p.name.slice(-2))}</span><div><b>${esc(p.name)}</b><div class="mini">${esc(p.role)}</div></div></div>${days.map(d=>{const ts=activeTasks(p.id).filter(t=>t.start<=d&&t.end>=d),h=dayHours(p.id,d);return `<div><button class="slot ${!h?'free':h>p.capacity?'over':''}" style="width:100%;text-align:left" data-assign="${esc(p.id)}" data-date="${d}" title="${esc(ts.map(t=>t.name).join(' / ')||'分配任务')}">${ts.length?esc(db.projects.find(x=>x.id===ts[0].project).name):'＋ 可安排'}${ts.length>1?' 等 '+ts.length+' 项':''}<br>${h?h.toFixed(1)+' / '+p.capacity+'h':'剩余 '+p.capacity+'h'}</button></div>`}).join('')}<div class="load ${load(p)>100?'red':load(p)<60?'green':''}">${Math.round(load(p))}%</div>`).join('')}</div>${db.people.length?'':'<div class="empty">先添加成员，开始安排工作。</div>'}</div><div class="cardfoot">未完成的逾期任务单独预警，需重新排期后才计入未来负荷。周末不计工时；暂未包含法定节假日、请假及任务依赖。</div></section>`}
function projectTable(){let ps=db.projects.filter(p=>p.name.toLowerCase().includes(query.toLowerCase())&&(filter==='all'||projectState(p)[0]===filter));return `<table><thead><tr><th>项目名称</th><th>完成进度</th><th>负责人</th><th>交付日期</th><th>状态</th></tr></thead><tbody>${ps.map(p=>{const state=projectState(p);return `<tr><td><button class="project-name" data-project="${esc(p.id)}"><span class="project-icon">${esc((p.code||'P').slice(0,1))}</span><div style="text-align:left">${esc(p.name)}<div class="mini">${esc(p.code)} · ${db.tasks.filter(t=>t.project===p.id).length} 个任务</div></div></button></td><td><div class="progress"><span>${progress(p)}%</span><div class="track"><i style="width:${progress(p)}%"></i></div></div></td><td>${esc(p.owner)}</td><td>${short(p.due)}</td><td><span class="status ${state[0]}">${state[1]}</span></td></tr>`}).join('')}</tbody></table>${ps.length?'':'<div class="empty">没有符合条件的项目</div>'}`}
function alerts(){const entries=[];db.tasks.filter(t=>t.status!=='done'&&t.end<today).forEach(t=>entries.push({title:t.name+'已逾期',body:`原截止 ${t.end}，请确认剩余工时并重新排期。`,label:'调整任务 →',attr:`data-task="${esc(t.id)}"`}));db.people.filter(p=>days.some(d=>dayHours(p.id,d)>p.capacity)).forEach(p=>entries.push({title:p.name+'存在超负荷排期',body:`周负荷 ${Math.round(load(p))}%，至少一天超出 ${p.capacity}h 容量，建议拆分或转派。`,label:'查看任务 →',attr:'data-view="tasks"'}));db.projects.filter(p=>projectState(p)[0]!=='ok').forEach(p=>entries.push({title:p.name+'交付需关注',body:`交付日期 ${p.due}。请检查逾期任务、临近截止日期及人员冲突。`,label:'查看项目 →',attr:`data-project="${esc(p.id)}"`}));db.people.filter(p=>load(p)<60).forEach(p=>entries.push({title:p.name+'有可调配时间',body:`周负荷 ${Math.round(load(p))}%，可结合技能承接待办任务。`,label:'安排任务 →',attr:`data-assign="${esc(p.id)}"`}));return `<section class="card"><div class="cardhead"><h2>风险与调配建议</h2><span class="pill">${entries.length} 项</span></div><div class="alerts" style="max-height:460px;overflow:auto">${entries.map(e=>`<div class="alert"><span class="alert-dot"></span><div><b>${esc(e.title)}</b><p>${esc(e.body)}</p><button ${e.attr}>${e.label}</button></div></div>`).join('')||'<div class="empty">暂无风险，保持当前节奏。</div>'}</div><div class="cardfoot">基于计划排期的提示，需结合技能与实际进度判断。</div></section>`}
function board(){return `<div class="board">${[['todo','待开始'],['doing','进行中'],['done','已完成']].map(([status,label])=>`<section class="column"><h2>${label} <span class="mini">${db.tasks.filter(t=>t.status===status).length}</span></h2>${db.tasks.filter(t=>t.status===status).map(t=>`<article class="task"><span class="pill">${esc(db.projects.find(p=>p.id===t.project).name)}</span><h3><button style="text-align:left;padding:0" data-task="${esc(t.id)}">${esc(t.name)} ↗</button></h3><p class="${t.end<today&&t.status!=='done'?'red':''}">${short(t.start)} — ${short(t.end)} · ${t.hours}h${t.end<today&&t.status!=='done'?' · 逾期':''}</p><div class="taskbottom"><span>${esc(db.people.find(p=>p.id===t.person).name)}</span><button class="textbtn" data-task="${esc(t.id)}">编辑 / 转派</button></div><select aria-label="${esc(t.name)}状态" data-status="${esc(t.id)}">${[['todo','待开始'],['doing','进行中'],['done','已完成']].map(([v,l])=>`<option value="${v}" ${v===status?'selected':''}>${l}</option>`).join('')}</select></article>`).join('')||'<div class="empty">暂无任务</div>'}</section>`).join('')}</div>`}
function people(){return `<div class="cardhead" style="border:0;padding:24px 0 0"><h2>团队成员 · ${db.people.length} 人</h2><button class="btn primary" data-addperson>＋ 添加成员</button></div><div class="peoplegrid">${db.people.map(p=>`<section class="card peoplecard"><div class="person"><span class="avatar">${esc(p.name.slice(-2))}</span><div><b>${esc(p.name)}</b><div class="mini">${esc(p.role)}</div></div></div><p style="font-size:12px">每日容量 ${p.capacity}h · ${activeTasks(p.id).length} 项未完成任务</p><div class="details">未来一周负荷 <b class="${load(p)>100?'red':'green'}">${Math.round(load(p))}%</b></div><div class="track"><i style="width:${Math.min(load(p),100)}%"></i></div><button class="btn" data-person="${esc(p.id)}">编辑成员与容量</button></section>`).join('')}</div>`}
function render(){metrics();$('#saveState').textContent=persistent?'数据保存在当前浏览器':'未能持久保存，请导出备份';const titles={overview:['工作总览','项目有序推进，团队从容协作','看清项目进展与人员投入，把风险解决在延期之前。'],resources:['人员排期','让合适的人，投入合适的项目','提前识别空闲与冲突，为团队保留合理缓冲。'],tasks:['任务看板','把计划拆解为清晰的下一步','跟踪任务状态，调整负责人、工时与交付时间。'],people:['团队成员','了解团队容量，平衡每个人的投入','维护成员职能与每日容量，为排期提供可靠依据。']};$('#breadcrumb').textContent=titles[view][0];$('#pageTitle').textContent=titles[view][1];$('#pageDesc').textContent=titles[view][2];document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#view').innerHTML=view==='overview'?`<div class="dashboard"><section class="card"><div class="cardhead"><div><h2>项目进展</h2><p>按已完成任务工时计算进度</p></div><button class="textbtn" data-addproject>＋ 新建项目</button></div><div class="toolbar"><input id="search" aria-label="搜索项目" placeholder="⌕  搜索项目名称" value="${esc(query)}"><select id="filter" aria-label="筛选项目状态"><option value="all">全部状态</option><option value="ok">正常 / 完成</option><option value="risk">有风险</option><option value="late">已延期</option></select></div><div class="tablewrap" id="projectsTable">${projectTable()}</div></section>${alerts()}</div>${resource()}`:view==='resources'?resource():view==='tasks'?board():people();if($('#filter'))$('#filter').value=filter}
function input(label,name,type='text',value='',attrs=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" required ${attrs}></label>`}
function options(label,name,items,value){return `<label>${label}<select name="${name}" required>${items.map(([id,title])=>`<option value="${esc(id)}" ${id===value?'selected':''}>${esc(title)}</option>`).join('')}</select></label>`}
function openForm(kind,id='',prefill={}){editKind=kind;editId=id;let fields='';if(kind==='task'){if(!db.people.length||!db.projects.length){toast('请先添加项目和团队成员');return}const t=db.tasks.find(t=>t.id===id)||{start:prefill.date||today,end:prefill.date||days[4],hours:8,status:'todo',person:prefill.person};$('#modalTitle').textContent=id?'编辑任务与排期':'分配新任务';fields=input('任务名称','name','text',t.name,'maxlength="100"')+options('所属项目','project',db.projects.map(p=>[p.id,p.name]),t.project)+options('负责人','person',db.people.map(p=>[p.id,`${p.name} · ${p.role} · 周负荷 ${Math.round(load(p))}%`]),t.person)+input('开始日期','start','date',t.start,'min="2000-01-01" max="2100-12-31"')+input('截止日期','end','date',t.end,'min="2000-01-01" max="2100-12-31"')+input('计划总工时（未完成任务请填写剩余工时）','hours','number',t.hours,'min="0.5" max="3000" step="0.5"')+options('任务状态','status',[['todo','待开始'],['doing','进行中'],['done','已完成']],t.status)}else if(kind==='project'){const p=db.projects.find(p=>p.id===id)||{due:days[4]};$('#modalTitle').textContent=id?'编辑项目':'新建项目';fields=input('项目名称','name','text',p.name,'maxlength="80"')+input('项目代号','code','text',p.code,'maxlength="16"')+input('项目负责人','owner','text',p.owner,'maxlength="40"')+input('计划交付日期','due','date',p.due,'min="2000-01-01" max="2100-12-31"')}else{const p=db.people.find(p=>p.id===id)||{capacity:8};$('#modalTitle').textContent=id?'编辑团队成员':'添加团队成员';fields=input('姓名','name','text',p.name,'maxlength="40"')+input('职能 / 技能','role','text',p.role,'maxlength="60"')+input('每日可用工时','capacity','number',p.capacity,'min="0.5" max="12" step="0.5"')}$('#fields').innerHTML=fields;$('#modal').showModal()}
$('#form').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));for(const k in data)data[k]=data[k].trim();if(Object.values(data).some(v=>!v)){toast('请完整填写各项内容');return}if(editKind==='task'){data.hours=Number(data.hours);if(data.start>data.end){toast('截止日期不能早于开始日期');return}if((parse(data.end)-parse(data.start))/86400000>366){toast('请把超过一年的任务拆分为较小任务');return}if(!workdays(data.start,data.end).length){toast('排期须包含至少一个工作日');return}}if(editKind==='person')data.capacity=Number(data.capacity);const key={task:'tasks',project:'projects',person:'people'}[editKind],next=structuredClone(db);if(editId){Object.assign(next[key].find(x=>x.id===editId),data)}else{next[key].push({...data,id:crypto.randomUUID()})}if(!valid(next)){toast('数据不符合要求，请检查日期、工时或条目数量');return}db=next;$('#modal').close();save();if(persistent)toast('已保存，排期与风险已更新')};
$('#cancel').onclick=()=>$('#modal').close();$('#newTask').onclick=()=>openForm('task');document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render()}else if(b.hasAttribute('data-addproject'))openForm('project');else if(b.hasAttribute('data-addperson'))openForm('person');else if(b.dataset.project)openForm('project',b.dataset.project);else if(b.dataset.task)openForm('task',b.dataset.task);else if(b.dataset.person)openForm('person',b.dataset.person);else if(b.dataset.assign)openForm('task','',{person:b.dataset.assign,date:b.dataset.date})});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#projectsTable').innerHTML=projectTable()}});document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;$('#projectsTable').innerHTML=projectTable()}if(e.target.dataset.status){db.tasks.find(t=>t.id===e.target.dataset.status).status=e.target.value;save();if(persistent)toast('任务状态已更新')}});
$('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=`teamflow-${today}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已发起数据导出')};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('文件不能超过 2MB');const d=JSON.parse(await f.text());if(!valid(d))throw Error('文件格式或关联数据无效，请使用本页面导出的 JSON');if(!confirm(`导入 ${d.projects.length} 个项目、${d.people.length} 名成员、${d.tasks.length} 个任务，将替换当前工作区。请先导出备份，是否继续？`))return;db=d;query='';filter='all';save();if(persistent)toast('导入成功')}catch(err){toast(err.message||'无法读取文件')}finally{e.target.value=''}};
$('#today').textContent=today.replaceAll('-',' / ');$('#range').textContent=`${short(days[0])} — ${short(days[4])} · 资源观察窗口`;render();
</script></body></html>
